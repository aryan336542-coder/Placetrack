services:
  app:
    build: .
    container_name: placetrack-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret_key}
      # If using Cloud MySQL (Aiven, TiDB Cloud, Railway), fill DATABASE_URL or DB_* below:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-placetrack_pass}
      DB_NAME: ${DB_NAME:-placetrack}
      DB_SSL: ${DB_SSL:-false}
    depends_on:
      - mysql

  # Optional self-hosted MySQL container (disable if using cloud MySQL)
  mysql:
    image: mysql:8.0
    container_name: placetrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-placetrack_pass}
      MYSQL_DATABASE: ${DB_NAME:-placetrack}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
